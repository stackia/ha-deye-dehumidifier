[project]
name = "ha-deye-dehumidifier"
version = "2.2.0"
description = "Home Assistant integration for Deye Dehumidifier"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
    { name = "Stackie Jia", email = "jsq2627@gmail.com" },
]
requires-python = ">=3.14.2"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
]
dependencies = [
    "libdeye==3.0.2",
]

[project.urls]
Homepage = "https://github.com/stackia/ha-deye-dehumidifier/"
Source = "https://github.com/stackia/ha-deye-dehumidifier/"

[dependency-groups]
dev = [
    "pre-commit",
    # Pinned to Home Assistant core requirements_test.txt / requirements_test_pre_commit.txt
    "ruff==0.16.4",
    "mypy==2.3.1",
    "pylint==4.0.7",
    "pylint-per-file-ignores==3.2.1",
    "codespell==2.4.3",
    "yamllint==1.38.0",
    # Latest stable Home Assistant Core release.
    "homeassistant==2026.8.3",
]
test = [
    # Generated against Home Assistant 2026.8.3 (same pin as the dev group).
    "pytest-homeassistant-custom-component==0.13.357",
]

[tool.uv]
package = false
default-groups = ["dev", "test"]
# The HA test plugin may pull a different pylint-per-file-ignores than the
# version pinned in the dev group; keep the lint pin.
override-dependencies = ["pylint-per-file-ignores==3.2.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
norecursedirs = ["dist", "build", ".venv"]

[tool.mypy]
python_version = "3.14"
platform = "linux"
show_error_codes = true
follow_imports = "normal"
# Keep mypy from mapping the integration twice when tests import
# custom_components.deye_dehumidifier.
explicit_package_bases = true
native_parser = true
local_partial_types = true
strict_equality = true
strict_bytes = true
no_implicit_optional = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_ignores = true
enable_error_code = [
    "deprecated",
    "explicit-override",
    "ignore-without-code",
    "redundant-self",
    "truthy-iterable",
]
disable_error_code = [
    "annotation-unchecked",
    "import-not-found",
    "import-untyped",
]
extra_checks = false
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
warn_return_any = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "custom_components.*"
no_implicit_reexport = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = "tests.*"
check_untyped_defs = false
disallow_incomplete_defs = false
disallow_subclassing_any = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_untyped_defs = false
warn_return_any = false
warn_unreachable = false
disable_error_code = [
    "annotation-unchecked",
    "import-not-found",
    "import-untyped",
    "arg-type",
    "method-assign",
]

# --- Lint / type-check tooling aligned with Home Assistant core ---
# https://github.com/home-assistant/core/blob/dev/pyproject.toml

[tool.pylint.MAIN]
py-version = "3.14"
jobs = 2
load-plugins = [
    "pylint.extensions.code_style",
    "pylint.extensions.typing",
    "pylint_per_file_ignores",
]
persistent = false
fail-on = ["I"]

[tool.pylint.BASIC]
class-const-naming-style = "any"

[tool.pylint."MESSAGES CONTROL"]
# Reasons disabled match Home Assistant core.
# format - handled by ruff
# locally-disabled - it spams too much
# duplicate-code - unavoidable
# cyclic-import - doesn't test if both import on load
# unused-argument - generic callbacks and setup methods create a lot of warnings
# too-many-* / too-few-* - not enforced for the sake of readability
# abstract-method - with intro of async there are always methods missing
# inconsistent-return-statements - doesn't handle raise
# too-many-ancestors - it's too strict.
# wrong-import-order - isort/ruff guards this
# possibly-used-before-assignment - too many errors / not necessarily issues
# consider-using-namedtuple-or-dataclass - too opinionated
# consider-using-assignment-expr - decision to use := better left to devs
disable = [
    "format",
    "abstract-method",
    "cyclic-import",
    "duplicate-code",
    "inconsistent-return-statements",
    "locally-disabled",
    "not-context-manager",
    "too-few-public-methods",
