# Aligned with Home Assistant core mypy.ini general settings:
# https://github.com/home-assistant/core/blob/dev/mypy.ini
# https://github.com/home-assistant/core/blob/dev/script/hassfest/mypy_config.py

[mypy]
python_version = 3.14
platform = linux
show_error_codes = true
follow_imports = normal
native_parser = true
local_partial_types = true
strict_equality = true
strict_bytes = true
no_implicit_optional = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_ignores = true
enable_error_code = deprecated, explicit-override, ignore-without-code, redundant-self, truthy-iterable
disable_error_code = annotation-unchecked, import-not-found, import-untyped
extra_checks = false
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
warn_return_any = true
warn_unreachable = true

# Home Assistant enables these only for core modules.
[mypy-custom_components.*]
no_implicit_reexport = true
disallow_any_generics = true

# Home Assistant disables strict checks for tests.
[mypy-tests.*]
check_untyped_defs = false
disallow_incomplete_defs = false
disallow_subclassing_any = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_untyped_defs = false
warn_return_any = false
warn_unreachable = false
