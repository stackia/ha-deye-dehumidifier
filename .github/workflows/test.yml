name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install the project
        run: uv sync --locked

      - name: Run lint
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Run type check
        run: uv run mypy .

      - name: Run pylint
        run: uv run pylint custom_components scripts tests

      - name: Run tests
        run: uv run pytest

  check-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Check version consistency
        run: uv run --no-project python scripts/check_versions.py
