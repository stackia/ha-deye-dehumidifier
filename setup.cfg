[metadata]
name = ha-deye-dehumidifier
description = Home Assistant integration for Deye Dehumidifier
author = Stackie Jia
author_email = jsq2627@gmail.com
license = MIT
license_files = LICENSE.txt
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/stackia/ha-deye-dehumidifier/
project_urls =
Source = https://github.com/stackia/ha-deye-dehumidifier/
platforms = any
classifiers =
    Development Status :: 5 - Production/Stable
    Programming Language :: Python
    Programming Language :: Python :: 3.14
    Topic :: Home Automation


[options]
zip_safe = False
packages = find_namespace:
include_package_data = True
package_dir =
    =custom_components
python_requires = >=3.14
install_requires =
    libdeye==2.1.6


[options.packages.find]
where = custom_components
exclude =
    tests

[options.extras_require]
dev =
    pre-commit
    # Pinned to Home Assistant core requirements_test.txt / requirements_test_pre_commit.txt
    ruff==0.16.4
    mypy==2.3.1
    pylint==4.0.7
    pylint-per-file-ignores==3.2.1
    codespell==2.4.3
    yamllint==1.38.0
    homeassistant==2026.8.3
